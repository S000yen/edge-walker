name: release

# タグ(v*)のpush，または手動実行（Actionsタブ → Run workflow でタグ名を入力）で，
# exeを2種類ビルドしてReleaseに添付する
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Releaseのタグ（例: v0.1.0）'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # 軽い版：.NET 10 デスクトップランタイムが入っている人向け
      - name: publish (framework-dependent)
        run: dotnet publish EdgeWalker.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o out/lite

      # 単体版：.NETが入っていない人向け（ランタイム込み・大きい）
      - name: publish (self-contained)
        run: dotnet publish EdgeWalker.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out/full

      - name: collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item out/lite/EdgeWalker.exe dist/EdgeWalker-lite.exe
          Copy-Item out/full/EdgeWalker.exe dist/EdgeWalker-standalone.exe
          Get-FileHash dist/*.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content dist/SHA256SUMS.txt
          Get-ChildItem dist | Format-Table Name, Length

      - name: create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $notes = @"
          - **EdgeWalker-lite.exe** : 軽い版。.NET 10 デスクトップランタイムが必要です。
          - **EdgeWalker-standalone.exe** : 単体版。.NETが入っていなくても動きます（サイズ大）。
          署名なしのため，SmartScreenの警告が出ることがあります。SHA-256は SHA256SUMS.txt を参照。
          "@
          gh release create $env:TAG dist/EdgeWalker-lite.exe dist/EdgeWalker-standalone.exe dist/SHA256SUMS.txt --target ${{ github.sha }} --title $env:TAG --notes $notes
